[pytest]
testpaths = tests
markers =
    integration: runs the real pipeline against the lab containers (needs --profile lab)
    slow: takes minutes rather than seconds
# Integration tests need the lab targets running, so they're opt-in:
#   unit only (default):  pytest
#   everything:           pytest -m "integration or not integration"
#   integration only:     pytest -m integration
addopts = -m "not integration"
