name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request that touches an engine should fail here before a human looks
# at it. The unit suite is a couple of seconds and covers the properties that
# matter most — scope containment, credential handling, false-positive
# suppression — so there is no reason not to run it on everything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: backend
        env:
          # The app creates its data directory at import time; point it at a
          # temporary path so CI doesn't need /data to exist.
          MERLON_DB_PATH: /tmp/ci/merlon.db
          MERLON_ARTIFACT_DIR: /tmp/ci/artifacts
          MERLON_TEMPLATE_DIR: /tmp/ci/templates
          MERLON_UPDATE_STATE: /tmp/ci/update-state.json
          # Never let CI reach out to update template repositories.
          MERLON_AUTO_UPDATE: "0"
        run: pytest -q --ignore=tests/integration

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Blocking. ruff.toml pins target-version to the OLDEST Python this must
      # import on, so this catches syntax that a newer interpreter would accept
      # and this one will not — plus the genuine bug class (B005, B023) that
      # reading the diff does not.
      - name: Lint
        working-directory: backend
        run: ruff check app/ tests/

  images:
    name: Docker build
    runs-on: ubuntu-latest
    # The image installs a dozen scanning tools from upstream releases, so it
    # is slow and it breaks for reasons that have nothing to do with the
    # change under review. Run it on main and on demand, not on every PR.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          # Loaded into the daemon so the next step can actually run it. A
          # build that succeeds can still produce an image whose entrypoint is
          # broken, whose app will not import, or that quietly lost a package —
          # none of which a build-only job would notice.
          load: true
          tags: merlon-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the backend image
        run: |
          set -euo pipefail
          img=merlon-backend:ci

          echo "--- the app imports and the CLI exists ---"
          docker run --rm "$img" python -m app.cli scan --help > /dev/null

          echo "--- every engine loads inside the image ---"
          count=$(docker run --rm "$img" python -c \
            "from app.engines import registry; registry.discover(); print(len(registry.all_engines()))")
          echo "engines: $count"
          [ "$count" -ge 40 ] || { echo "::error::only $count engines loaded"; exit 1; }

          echo "--- the MCP server answers a handshake ---"
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            | docker run --rm -i "$img" python -m app.mcp_server \
            | grep -q '"serverInfo"' \
            || { echo "::error::MCP server did not respond"; exit 1; }

          echo "--- chromium is present (DOM XSS and screenshots need it) ---"
          docker run --rm "$img" python -c \
            "from app.engines import browser; import sys; \
             print('chrome:', browser.binary()); sys.exit(0 if browser.available() else 1)" \
            || { echo "::error::no browser in the image — domxss and screenshots would silently skip"; exit 1; }
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # This repository stores session cookies at runtime. A commit that
      # accidentally includes one should be caught here rather than by
      # somebody reading the diff.
      #
      # The gitleaks *binary* is MIT-licensed and free. The gitleaks-action
      # wrapper is not: since v2 it refuses to run for an organisation-owned
      # repository without a paid GITLEAKS_LICENSE secret, and fails the job
      # with "missing gitleaks license" before scanning anything. Running the
      # release binary directly gets the same scan, pinned to a known version,
      # with no licence server in the path.
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          # --redact so a real finding does not get reprinted in a public log.
          /tmp/gitleaks detect --source . --redact --verbose --exit-code 1
