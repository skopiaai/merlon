name: Release

# Cutting a tag publishes the images and the release notes. Nothing here runs
# on a normal push, so a broken release can never break main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write     # create the GitHub Release
  packages: write     # push to ghcr.io

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated on an amd64 runner, so this is needed before buildx
      # can produce it. It makes the release build slow; shipping an image half
      # the audience cannot run is worse.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image name must be lowercase; the owner may not be.
      - name: Work out the image name
        id: meta
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${owner}/merlon-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          ref="${{ github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # v0.1.0 shipped amd64 only, and `docker pull` failed outright on
          # Apple Silicon with "no matching manifest for linux/arm64/v8" — a
          # large share of the people this tool is for. CI runs on amd64, so
          # nothing caught it until the image was pulled on an arm64 machine.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT

  release:
    name: Create the release
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          notes=$(mktemp)
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "git clone https://github.com/${{ github.repository }}.git"
            echo "cd merlon && ./start.sh          # macOS / Linux"
            echo '```'
            echo
            echo "Prebuilt images, if you would rather not build:"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${owner}/merlon-backend:${tag#v}"
            echo "docker pull ghcr.io/${owner}/merlon-frontend:${tag#v}"
            echo '```'
            echo
            echo "See CHANGELOG.md for what changed."
          } > "$notes"
          gh release create "$tag" --title "$tag" --notes-file "$notes" \
            || gh release edit "$tag" --notes-file "$notes"
